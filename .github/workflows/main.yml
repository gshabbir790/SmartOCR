name: Flutter APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Download Tesseract trained data
        run: |
          mkdir -p assets/tessdata
          for lang in eng ara hin; do
            curl -fL -o "assets/tessdata/${lang}.traineddata" \
              "https://github.com/tesseract-ocr/tessdata_fast/raw/main/${lang}.traineddata"
          done
          # Urdu is the app's most sensitive script: use Tesseract's larger
          # best model instead of the speed model for noticeably better
          # Nastaliq recognition.
          curl -fL -o assets/tessdata/urd.traineddata \
            "https://github.com/tesseract-ocr/tessdata_best/raw/main/urd.traineddata"
          cat << 'EOF' > assets/tessdata_config.json
          {
            "files": [
              "eng.traineddata",
              "urd.traineddata",
              "ara.traineddata",
              "hin.traineddata"
            ]
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch tesseract_ocr duplicate plugin
        shell: bash
        run: |
          set -e

          TESSERACT_KT=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/tesseract_ocr-*/android/src/main/kotlin/io/paratoner/tesseract_ocr/TesseractOcrPlugin.kt" \
            -print -quit)

          if [ -n "$TESSERACT_KT" ]; then
            echo "Removing duplicate Kotlin plugin:"
            echo "$TESSERACT_KT"
            rm -f "$TESSERACT_KT"
          else
            echo "No tesseract_ocr Kotlin plugin file found to patch (version may have changed) — continuing without patching."
          fi

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          # A single universal APK containing every architecture
          # (armeabi-v7a, arm64-v8a, x86_64), so it installs on any
          # Android device regardless of processor type. This is larger
          # than a single-architecture split APK, but guarantees it
          # will actually install on your phone.
          path: build/app/outputs/flutter-apk/app-release.apk
