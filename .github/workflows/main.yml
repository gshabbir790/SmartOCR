name: Android CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
          
      # یہ نیا سٹیپ فولڈر اور کنفیگریشن فائل بنائے گا
      - name: Create missing tessdata_config.json
        run: |
          mkdir -p assets/tessdata
          cat << 'EOF' > assets/tessdata_config.json
          {
            "files": [
              "eng.traineddata",
              "urd.traineddata",
              "ara.traineddata",
              "hin.traineddata"
            ]
          }
          EOF

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      
