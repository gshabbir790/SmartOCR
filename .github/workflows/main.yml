name: Flutter APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Download Tesseract trained data
        run: |
          mkdir -p assets/tessdata

          # English
          curl -fL --retry 3 \
            -o assets/tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata

          # Arabic
          curl -fL --retry 3 \
            -o assets/tessdata/ara.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata

          # Hindi
          curl -fL --retry 3 \
            -o assets/tessdata/hin.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/hin.traineddata

          # Official high-accuracy Urdu model
          curl -fL --retry 3 \
            -o assets/tessdata/urd.traineddata \
            https://github.com/tesseract-ocr/tessdata_best/raw/main/urd.traineddata

          # Urdu Nastaliq specialized model
          curl -fL --retry 3 \
            -o assets/tessdata/urd_naw.traineddata \
            https://github.com/tesseract-ocr/tessdata_contrib/raw/main/urd_naw/urd_naw.traineddata

          echo "Downloaded OCR models:"
          ls -lh assets/tessdata/

          cat << 'EOF' > assets/tessdata_config.json
          {
            "files": [
              "eng.traineddata",
              "urd_naw.traineddata",
              "urd.traineddata",
              "ara.traineddata",
              "hin.traineddata"
            ]
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch tesseract_ocr duplicate plugin
        shell: bash
        run: |
          set -e

          TESSERACT_KT=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/tesseract_ocr-*/android/src/main/kotlin/io/paratoner/tesseract_ocr/TesseractOcrPlugin.kt" \
            -print -quit)

          if [ -n "$TESSERACT_KT" ]; then
            echo "Removing duplicate Kotlin plugin:"
            echo "$TESSERACT_KT"
            rm -f "$TESSERACT_KT"
          else
            echo "No tesseract_ocr Kotlin plugin file found to patch (version may have changed) — continuing without patching."
          fi

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
