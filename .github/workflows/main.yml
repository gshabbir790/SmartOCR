name: Flutter APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Download Tesseract trained data
        run: |
          mkdir -p assets/tessdata
          for lang in eng urd ara hin; do
            curl -fL -o "assets/tessdata/${lang}.traineddata" \
              "https://github.com/tesseract-ocr/tessdata_fast/raw/main/${lang}.traineddata"
          done
          cat << 'EOF' > assets/tessdata_config.json
          {
            "files": [
              "eng.traineddata",
              "urd.traineddata",
              "ara.traineddata",
              "hin.traineddata"
            ]
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch tesseract_ocr duplicate plugin
        shell: bash
        run: |
          set -e

          TESSERACT_KT=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/tesseract_ocr-*/android/src/main/kotlin/io/paratoner/tesseract_ocr/TesseractOcrPlugin.kt" \
            -print -quit)

          if [ -n "$TESSERACT_KT" ]; then
            echo "Removing duplicate Kotlin plugin:"
            echo "$TESSERACT_KT"
            rm -f "$TESSERACT_KT"
          else
            echo "No tesseract_ocr Kotlin plugin file found to patch (version may have changed) — continuing without patching."
          fi

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          # Only the arm64-v8a build is uploaded — this covers virtually
          # every Android phone sold since ~2017. The armeabi-v7a and
          # x86_64 splits are still produced locally by the build step
          # above (in build/app/outputs/flutter-apk/) in case you ever
          # need to support an older 32-bit device, but skipping them
          # here keeps the download you actually get down to one small
          # APK instead of three bundled together.
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
