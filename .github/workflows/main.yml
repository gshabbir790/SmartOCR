name: Flutter APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Create missing tessdata_config.json
        run: |
          mkdir -p assets/tessdata
          cat << 'EOF' > assets/tessdata_config.json
          {
            "files": [
              "eng.traineddata",
              "urd.traineddata",
              "ara.traineddata",
              "hin.traineddata"
            ]
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch tesseract_ocr duplicate plugin
        shell: bash
        run: |
          set -e

          TESSERACT_KT=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/tesseract_ocr-0.5.0/android/src/main/kotlin/io/paratoner/tesseract_ocr/TesseractOcrPlugin.kt" \
            -print -quit)

          if [ -n "$TESSERACT_KT" ]; then
            echo "Removing duplicate Kotlin plugin:"
            echo "$TESSERACT_KT"
            rm -f "$TESSERACT_KT"
          else
            echo "ERROR: tesseract_ocr-0.5.0 Kotlin plugin file was not found."
            exit 1
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
