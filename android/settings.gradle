pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file('local.properties').withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        assert flutterSdkPath != null, 'flutter.sdk not set in local.properties'
        return flutterSdkPath
    }()
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
// NOTE: no dependencyResolutionManagement block here on purpose. Setting
// repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS) blocks the Flutter
// Gradle plugin from adding its own project-level repository for the
// io.flutter:*_release engine artifacts, which causes:
//   "Could not find io.flutter:armeabi_v7a_release:..."
// Each subproject (the Flutter plugin's own :flutter module, :app, and any
// plugin) is left free to declare the repositories it needs, same as the
// standard `flutter create` template.
rootProject.name = 'smart_ocr'
include ':app'
