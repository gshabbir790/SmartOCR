pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file('local.properties').withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        assert flutterSdkPath != null, 'flutter.sdk not set in local.properties'
        return flutterSdkPath
    }()
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    // repo1.maven.org is Maven Central's direct origin (no CDN in front of
    // it). Listed as a fallback in case plugins.gradle.org / the
    // repo.maven.apache.org CDN returns a transient 403 during resolution,
    // which is a known intermittent issue on GitHub Actions runners.
    repositories { google(); mavenCentral(); maven { url 'https://repo1.maven.org/maven2' }; gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories { google(); mavenCentral(); maven { url 'https://repo1.maven.org/maven2' } }
}
rootProject.name = 'smart_ocr'
include ':app'
