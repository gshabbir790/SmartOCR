plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'dev.flutter.flutter-gradle-plugin' }

// Only :app needs this — it resolves plain dependencies like kotlin-stdlib
// that the Flutter Gradle plugin's own injected repository doesn't carry.
// Declared here (module-level) rather than at the root as `allprojects`,
// because doing it at the root previously interfered with how the Flutter
// Gradle plugin sets up :app's own repository for engine/embedding
// artifacts (io.flutter:flutter_embedding_release etc.).
repositories {
    google()
    mavenCentral()
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android { namespace 'com.gshabbir.ocrscanner'; compileSdk 36; ndkVersion "28.2.13676358"
    defaultConfig { applicationId 'com.gshabbir.ocrscanner'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0.0' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter { source '../..' }
